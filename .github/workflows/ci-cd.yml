name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest tests/ -v --tb=short
        env:
          PYTHONPATH: ${{ github.workspace }}

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    outputs:
      image_pushed: ${{ steps.push_check.outputs.pushed }}
    steps:
      - uses: actions/checkout@v4

      - name: Check Docker secrets
        id: push_check
        run: |
          if [[ -n "${{ secrets.DOCKERHUB_USERNAME }}" && -n "${{ secrets.DOCKERHUB_TOKEN }}" ]]; then
            echo "pushed=true" >> $GITHUB_OUTPUT
          else
            echo "pushed=false" >> $GITHUB_OUTPUT
            echo "::notice::DOCKERHUB_USERNAME / DOCKERHUB_TOKEN not set — skipping Docker push."
          fi

      - name: Log in to Docker Hub
        if: steps.push_check.outputs.pushed == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        if: steps.push_check.outputs.pushed == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/vision-qa-pipeline:latest,${{ secrets.DOCKERHUB_USERNAME }}/vision-qa-pipeline:${{ github.sha }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    # Only deploy when an image was actually pushed — not on skipped builds
    if: needs.build-and-push.outputs.image_pushed == 'true'
    steps:
      - name: Check AWS secrets
        id: aws_check
        run: |
          if [[ -n "${{ secrets.AWS_ACCESS_KEY_ID }}" && -n "${{ secrets.AWS_SECRET_ACCESS_KEY }}" ]]; then
            echo "deploy=true" >> $GITHUB_OUTPUT
          else
            echo "deploy=false" >> $GITHUB_OUTPUT
            echo "::notice::AWS secrets not set — skipping ECS deploy."
          fi

      - name: Configure AWS credentials
        if: steps.aws_check.outputs.deploy == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-west-3

      - name: Deploy to ECS
        if: steps.aws_check.outputs.deploy == 'true'
        run: |
          aws ecs update-service \
            --cluster vision-qa-cluster \
            --service vision-qa-api \
            --force-new-deployment
