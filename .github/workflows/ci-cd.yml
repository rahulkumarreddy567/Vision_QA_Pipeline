name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest tests/ -v
        env:
          PYTHONPATH: ${{ github.workspace }}

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    env:
      HAS_DOCKER_SECRETS: ${{ secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Skip notice (no Docker secrets)
        if: env.HAS_DOCKER_SECRETS == 'false'
        run: |
          echo "::notice::DOCKERHUB_USERNAME / DOCKERHUB_TOKEN secrets not set — skipping Docker push."
          echo "Add them at: Settings > Secrets and variables > Actions"

      - name: Log in to Docker Hub
        if: env.HAS_DOCKER_SECRETS == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        if: env.HAS_DOCKER_SECRETS == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/vision-qa-pipeline:latest

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    env:
      HAS_AWS_SECRETS: ${{ secrets.AWS_ACCESS_KEY_ID != '' && secrets.AWS_SECRET_ACCESS_KEY != '' }}
    steps:
      - name: Skip notice (no AWS secrets)
        if: env.HAS_AWS_SECRETS == 'false'
        run: |
          echo "::notice::AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY secrets not set — skipping ECS deploy."
          echo "Add them at: Settings > Secrets and variables > Actions"

      - name: Configure AWS credentials
        if: env.HAS_AWS_SECRETS == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-west-3

      - name: Deploy to ECS
        if: env.HAS_AWS_SECRETS == 'true'
        run: |
          aws ecs update-service \
            --cluster vision-qa-cluster \
            --service vision-qa-api \
            --force-new-deployment
