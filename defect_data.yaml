# YOLO dataset config — adjust paths/classes to match your chosen dataset.
# Example below matches NEU-DET (6 steel surface defect classes).

path: data/raw            # dataset root
train: images/train
val: images/val
test: images/test         # optional

names:
  0: crazing
  1: inclusion
  2: patches
  3: pitted_surface
  4: rolled-in_scale
  5: scratches
