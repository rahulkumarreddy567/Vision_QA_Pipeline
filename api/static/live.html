<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Vision QA — Live Defect Detection</title>
<style>
  body { font-family: system-ui, sans-serif; background: #111; color: #eee; margin: 0; padding: 20px; }
  h1 { font-size: 1.2rem; font-weight: 600; }
  #wrap { position: relative; width: 640px; max-width: 100%; }
  video, canvas { width: 100%; border-radius: 8px; }
  canvas { position: absolute; top: 0; left: 0; }
  #stats { margin-top: 12px; font-size: 0.9rem; color: #9f9; }
  #status { color: #f99; }
</style>
</head>
<body>
  <h1>Vision QA Pipeline — Live Defect Detection</h1>
  <div id="wrap">
    <video id="video" autoplay muted playsinline></video>
    <canvas id="overlay"></canvas>
  </div>
  <div id="stats">Connecting…</div>
  <div id="status"></div>

<script>
const video = document.getElementById('video');
const overlay = document.getElementById('overlay');
const ctx = overlay.getContext('2d');
const statsEl = document.getElementById('stats');
const statusEl = document.getElementById('status');

const captureCanvas = document.createElement('canvas');
const captureCtx = captureCanvas.getContext('2d');

const SEND_INTERVAL_MS = 300; // throttle: send ~3 frames/sec, adjust for your GPU

async function start() {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ video: true });
    video.srcObject = stream;
  } catch (err) {
    statusEl.textContent = 'Camera access denied or unavailable: ' + err.message;
    return;
  }

  video.addEventListener('loadedmetadata', () => {
    overlay.width = video.videoWidth;
    overlay.height = video.videoHeight;
    captureCanvas.width = video.videoWidth;
    captureCanvas.height = video.videoHeight;
  });

  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  const ws = new WebSocket(`${proto}://${location.host}/ws/stream`);

  ws.onopen = () => { statsEl.textContent = 'Connected. Streaming…'; };
  ws.onclose = () => { statsEl.textContent = 'Disconnected.'; };
  ws.onerror = () => { statusEl.textContent = 'WebSocket error — is the server running?'; };

  ws.onmessage = (event) => {
    const data = JSON.parse(event.data);
    drawDetections(data.detections || []);
    statsEl.textContent =
      `defects: ${data.num_defects} | inference: ${data.inference_time_ms.toFixed(1)} ms`;
  };

  setInterval(() => {
    if (ws.readyState !== WebSocket.OPEN) return;
    captureCtx.drawImage(video, 0, 0, captureCanvas.width, captureCanvas.height);
    const frame = captureCanvas.toDataURL('image/jpeg', 0.6);
    ws.send(frame);
  }, SEND_INTERVAL_MS);
}

function drawDetections(detections) {
  ctx.clearRect(0, 0, overlay.width, overlay.height);
  ctx.lineWidth = 2;
  ctx.strokeStyle = '#ff3b3b';
  ctx.font = '16px system-ui';
  ctx.fillStyle = '#ff3b3b';

  for (const d of detections) {
    const [x1, y1, x2, y2] = d.bbox;
    ctx.strokeRect(x1, y1, x2 - x1, y2 - y1);
    const label = `${d.defect_type} ${(d.classification_confidence * 100).toFixed(0)}%`;
    ctx.fillText(label, x1, Math.max(y1 - 6, 12));
  }
}

start();
</script>
</body>
</html>
