services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./runs:/app/runs
      - ./models:/app/models
      - ./mlruns:/app/mlruns
    environment:
      - YOLO_WEIGHTS=runs/detect/defect_yolo11/weights/best.pt
      - RESNET_WEIGHTS=models/resnet50_defect_classifier.pt
      - MLFLOW_TRACKING_URI=http://mlflow:5000   # connects API to MLflow server
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      mlflow:
        condition: service_started

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.16.0
    ports:
      - "5000:5000"
    volumes:
      - ./mlruns:/mlruns
    command: >
      mlflow server
      --backend-store-uri /mlruns
      --default-artifact-root /mlruns
      --host 0.0.0.0
      --port 5000
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
