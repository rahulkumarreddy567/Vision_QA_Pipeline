# render.yaml — Deployment on Render.com
# 1. Push this repo to GitHub
# 2. Go to https://dashboard.render.com → New → Blueprint
# 3. Connect your repo — Render reads this file and deploys automatically

services:
  - type: web
    name: vision-qa-pipeline
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /health
    envVars:
      - key: YOLO_WEIGHTS
        value: yolo11n.pt
      - key: RESNET_WEIGHTS
        value: ""
      - key: ALLOWED_ORIGINS
        value: "*"
      - key: MAX_UPLOAD_BYTES
        value: "10485760"
    autoDeploy: true
